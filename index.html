<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>League Box</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#111827}
header{background:#111827;color:white;padding:18px 18px 16px;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:25px}.sub{opacity:.7;font-size:13px;margin-top:3px}
main{max-width:850px;margin:auto;padding:16px 14px 90px}
.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #0000000a}
button,input,select{font:inherit}
button{border:0;border-radius:11px;padding:11px 14px;background:#111827;color:white;font-weight:600;cursor:pointer}
button.secondary{background:#e5e7eb;color:#111827}
button.danger{background:#fee2e2;color:#991b1b}
.row{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:#6b7280;font-size:13px}
input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;background:white}
.field{margin:8px 0}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav button{background:transparent;color:#6b7280;padding:8px;font-size:12px}
nav button.active{color:#111827}
h2{margin:3px 0 12px;font-size:19px}
h3{margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid #eee}
th{font-size:11px;color:#6b7280;text-transform:uppercase}
.team{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.bracket{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.round{min-width:205px}
.match{background:#f9fafb;border:1px solid #dfe3e8;border-radius:12px;padding:9px;margin:8px 0}
.match .slot{display:flex;justify-content:space-between;gap:5px;padding:6px;border-radius:8px}
.match .winner{font-weight:800;background:#e5e7eb}
.small{font-size:12px}
.empty{padding:25px;text-align:center;color:#6b7280}
.scoreGrid{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center}
.scoreGrid select{margin-bottom:8px}
.scoreGrid input{margin-bottom:8px}
.teamLink{cursor:pointer;text-decoration:underline;color:#111827}
.teamLink:hover{opacity:.7}
</style>
</head>

<body>

<header>
<h1>League Box</h1>
<div class="sub">Teams, scores, standings & editable brackets</div>
</header>

<main id="app"></main>

<nav>
<button id="navHome" onclick="showHome()" class="active">⌂<br>Home</button>
<button id="navLeagues" onclick="showLeagues()">▤<br>Leagues</button>
<button id="navTournaments" onclick="showTournaments()">🏆<br>Tournaments</button>
</nav>

<script>

const KEY="leaguebox-v1";

let db=JSON.parse(localStorage.getItem(KEY)||'{"leagues":[],"tournaments":[]}');

db.leagues.forEach(l=>{
  if(!l.games)l.games=[];
});

db.tournaments.forEach(t=>{
  if(!t.games)t.games=[];
  if(!t.rounds)t.rounds=[];
  if(!t.mode)t.mode="bracket";
  if(!t.pools)t.pools=[];
  if(!t.poolCount)t.poolCount=0;
});

let current=null;

const save=()=>localStorage.setItem(KEY,JSON.stringify(db));

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
}[m]));

function app(x){
  document.getElementById("app").innerHTML=x;
}

function setActive(id){
  document.querySelectorAll("nav button")
    .forEach(x=>x.classList.remove("active"));

  document.getElementById(id)?.classList.add("active");
}


/* =========================
   HOME
========================= */

function showHome(){

  setActive("navHome");

  app(`
  <div class="card">
    <h2>Welcome to League Box</h2>
    <p class="muted">
      Create a league or tournament, add teams, then enter scores.
      League Box handles the standings automatically.
    </p>

    <div class="row">
      <button onclick="newLeague()">+ League</button>
      <button onclick="newTournament()">+ Tournament</button>
    </div>
  </div>

  ${db.leagues.length?`
  <div class="card">
    <h3>Your leagues</h3>

    ${db.leagues.map(l=>`
      <div class="team">
        <span>
          <b>${esc(l.name)}</b><br>
          <span class="muted">${l.teams.length} teams</span>
        </span>

        <button class="secondary"
          onclick="openLeague('${l.id}')">
          Open
        </button>
      </div>
    `).join("")}
  </div>`:""}

  ${db.tournaments.length?`
  <div class="card">
    <h3>Your tournaments</h3>

    ${db.tournaments.map(t=>`
      <div class="team">
        <span>
          <b>${esc(t.name)}</b><br>
          <span class="muted">
            ${t.teams.length} teams
          </span>
        </span>

        <button class="secondary"
          onclick="openTournament('${t.id}')">
          Open
        </button>
      </div>
    `).join("")}
  </div>`:""}
  `);
}


/* =========================
   LEAGUES
========================= */

function showLeagues(){

  setActive("navLeagues");

  app(`
  <div class="row" style="margin-bottom:12px">
    <button onclick="newLeague()">+ New League</button>
  </div>

  ${db.leagues.map(l=>`
    <div class="card">
      <h3>${esc(l.name)}</h3>

      <div class="muted">
        ${l.teams.length} teams • ${l.games.length} games
      </div>

      <br>

      <button onclick="openLeague('${l.id}')">
        Open
      </button>
    </div>
  `).join("") || `
    <div class="card empty">
      No leagues yet.
    </div>
  `}
  `);
}

function newLeague(){

  const name=prompt("League name?");

  if(!name)return;

  let l={
    id:crypto.randomUUID(),
    name,
    teams:[],
    games:[]
  };

  db.leagues.push(l);

  save();

  openLeague(l.id);
}

function openLeague(id){

  let l=db.leagues.find(x=>x.id===id);

  current=l;

  setActive("navLeagues");

  renderLeague(l);
}

function getLeagueStats(l){

  let stats={};

  l.teams.forEach(n=>{
    stats[n]={
      w:0,
      l:0,
      t:0,
      pf:0,
      pa:0,
      g:0
    };
  });

  l.games.forEach(g=>{

    if(!stats[g.a]||!stats[g.b])return;

    stats[g.a].g++;
    stats[g.b].g++;

    stats[g.a].pf+=Number(g.as);
    stats[g.a].pa+=Number(g.bs);

    stats[g.b].pf+=Number(g.bs);
    stats[g.b].pa+=Number(g.as);

    if(g.as>g.bs){

      stats[g.a].w++;
      stats[g.b].l++;

    }else if(g.bs>g.as){

      stats[g.b].w++;
      stats[g.a].l++;

    }else{

      stats[g.a].t++;
      stats[g.b].t++;

    }
  });

  return stats;
}

function renderLeague(l){

  let stats=getLeagueStats(l);

  let rows=l.teams.map(n=>({
    n,
    ...stats[n],
    diff:stats[n].pf-stats[n].pa,
    points:stats[n].w*3+stats[n].t
  }))
  .sort((a,b)=>
    b.points-a.points ||
    b.diff-a.diff ||
    b.pf-a.pf
  );

  app(`

  <div class="row">

    <button class="secondary"
      onclick="showLeagues()">
      ← Leagues
    </button>

    <button class="danger"
      onclick="deleteLeague('${l.id}')">
      Delete
    </button>

  </div>

  <div class="card">

    <h2>${esc(l.name)}</h2>

    <div class="row">

      <button onclick="addTeamLeague('${l.id}')">
        + Team
      </button>

      <button onclick="addGame('${l.id}')">
        + Score
      </button>

    </div>

  </div>

  <div class="card">

    <h3>Standings</h3>

    ${rows.length?`

    <table>

      <tr>
        <th>#</th>
        <th>Team</th>
        <th>GP</th>
        <th>W</th>
        <th>L</th>
        <th>T</th>
        <th>PF</th>
        <th>PA</th>
        <th>+/-</th>
        <th>Pts</th>
      </tr>

      ${rows.map((r,i)=>`

      <tr>

        <td>${i+1}</td>

        <td>
          <b class="teamLink" onclick="showTeamHistory('${l.id}','${encodeURIComponent(r.n)}')">${esc(r.n)}</b>
        </td>

        <td>${r.g}</td>
        <td>${r.w}</td>
        <td>${r.l}</td>
        <td>${r.t}</td>

        <td>${r.pf}</td>
        <td>${r.pa}</td>
        <td>${r.diff}</td>

        <td><b>${r.points}</b></td>

      </tr>

      `).join("")}

    </table>

    <p class="muted">
      Win = 3 points • Tie = 1 point • Loss = 0
    </p>

    `:`
      <div class="empty">
        Add teams to start.
      </div>
    `}

  </div>


  <div class="card">

    <h3>Games</h3>

    ${l.games.map((g,i)=>`

      <div class="team">

        <span>
          ${esc(g.a)}
          <b>${g.as}</b>
          —
          <b>${g.bs}</b>
          ${esc(g.b)}

          ${
            g.as===g.bs
            ? `<span class="muted"> TIE</span>`
            : ""
          }
        </span>

        <div class="row">
          <button class="secondary"
            onclick="editGame('${l.id}',${i})">
            Edit
          </button>

          <button class="danger"
            onclick="deleteGame('${l.id}',${i})">
            Delete
          </button>
        </div>

      </div>

    `).join("") || `
      <div class="empty">
        No scores yet.
      </div>
    `}

  </div>


  <div class="card">

    <h3>Teams</h3>

    ${l.teams.map(n=>`

      <div class="team">

        <span>${esc(n)}</span>

        <button class="danger"
          onclick="removeTeamLeague(
            '${l.id}',
            '${encodeURIComponent(n)}'
          )">
          Remove
        </button>

      </div>

    `).join("")}

  </div>
  `);
}

function showTeamHistory(leagueId, encodedTeamName){

  let l=db.leagues.find(x=>x.id===leagueId);
  let teamName=decodeURIComponent(encodedTeamName);

  let games=l.games.filter(g=>g.a===teamName || g.b===teamName);

  app(`

  <div class="row">

    <button class="secondary"
      onclick="renderLeague(
        db.leagues.find(x=>x.id==='${leagueId}')
      )">
      ← Back
    </button>

  </div>

  <div class="card">

    <h2>${esc(teamName)}</h2>
    <div class="muted">Game History</div>

  </div>

  <div class="card">

    <h3>Previous Games</h3>

    ${games.length?`

      ${games.map((g,i)=>`

        <div class="team">

          <span>
            ${esc(g.a)}
            <b>${g.as}</b>
            —
            <b>${g.bs}</b>
            ${esc(g.b)}

            ${
              g.as===g.bs
              ? `<span class="muted"> TIE</span>`
              : g.a===teamName && g.as>g.bs
              ? `<span class="muted"> W</span>`
              : g.b===teamName && g.bs>g.as
              ? `<span class="muted"> W</span>`
              : `<span class="muted"> L</span>`
            }
          </span>

          <div class="row">
            <button class="secondary"
              onclick="editGame('${leagueId}',${l.games.indexOf(g)})">
              Edit
            </button>

            <button class="danger"
              onclick="deleteGame('${leagueId}',${l.games.indexOf(g)})">
              Delete
            </button>
          </div>

        </div>

      `).join("")}

    `:`
      <div class="empty">
        No games yet.
      </div>
    `}

  </div>
  `);
}

function addTeamLeague(id){

  let l=db.leagues.find(x=>x.id===id);

  let n=prompt("Team name?");

  if(!n)return;

  if(!l.teams.includes(n))
    l.teams.push(n);

  save();

  renderLeague(l);
}

function removeTeamLeague(id,en){

  let l=db.leagues.find(x=>x.id===id);

  let n=decodeURIComponent(en);

  if(confirm("Remove "+n+"?")){

    l.teams=l.teams.filter(x=>x!==n);

    l.games=l.games.filter(
      g=>g.a!==n&&g.b!==n
    );

    save();

    renderLeague(l);
  }
}


/* =========================
   LEAGUE SCORE ENTRY
========================= */

function addGame(id){

  let l=db.leagues.find(x=>x.id===id);

  if(l.teams.length<2)
    return alert("Add at least 2 teams first.");

  app(`

  <div class="card">

    <h2>Add Score</h2>

    <div class="field">

      <label>Team 1</label>

      <select id="scoreTeam1">

        <option value="">
          Select Team
        </option>

        ${l.teams.map((t,i)=>`
          <option value="${i}">
            ${esc(t)}
          </option>
        `).join("")}

      </select>

    </div>


    <div class="field">

      <label>Team 1 Score</label>

      <input
        id="score1"
        type="number"
        min="0"
        inputmode="numeric"
        placeholder="Enter score"
      >

    </div>


    <div class="field">

      <label>Team 2</label>

      <select id="scoreTeam2">

        <option value="">
          Select Team
        </option>

        ${l.teams.map((t,i)=>`
          <option value="${i}">
            ${esc(t)}
          </option>
        `).join("")}

      </select>

    </div>


    <div class="field">

      <label>Team 2 Score</label>

      <input
        id="score2"
        type="number"
        min="0"
        inputmode="numeric"
        placeholder="Enter score"
      >

    </div>


    <div class="row">

      <button onclick="saveLeagueGame('${l.id}')">
        Save Score
      </button>

      <button class="secondary"
        onclick="renderLeague(
          db.leagues.find(x=>x.id==='${l.id}')
        )">
        Cancel
      </button>

    </div>

  </div>
  `);
}

function saveLeagueGame(id){

  let l=db.leagues.find(x=>x.id===id);

  let aIndex=document.getElementById("scoreTeam1").value;
  let bIndex=document.getElementById("scoreTeam2").value;

  let as=document.getElementById("score1").value;
  let bs=document.getElementById("score2").value;

  if(aIndex===""||bIndex==="")
    return alert("Select both teams.");

  if(aIndex===bIndex)
    return alert("Choose two different teams.");

  if(as===""||bs==="")
    return alert("Enter both scores.");

  as=Number(as);
  bs=Number(bs);

  if(as<0||bs<0)
    return alert("Scores cannot be negative.");

  l.games.push({
    a:l.teams[aIndex],
    b:l.teams[bIndex],
    as,
    bs
  });

  save();

  renderLeague(l);
}

function editGame(id,i){

  let l=db.leagues.find(x=>x.id===id);

  let g=l.games[i];

  let a=prompt(
    "Team 1:\n"+l.teams.join("\n"),
    g.a
  );

  if(!l.teams.includes(a))return;

  let b=prompt(
    "Team 2:\n"+l.teams.join("\n"),
    g.b
  );

  if(!l.teams.includes(b)||a===b)return;

  let as=Number(
    prompt("Score for "+a,g.as)
  );

  let bs=Number(
    prompt("Score for "+b,g.bs)
  );

  if(
    Number.isFinite(as)&&
    Number.isFinite(bs)
  ){

    g.a=a;
    g.b=b;
    g.as=as;
    g.bs=bs;

    save();

    renderLeague(l);
  }
}

function deleteGame(id,i){

  let l=db.leagues.find(x=>x.id===id);

  let g=l.games[i];

  if(confirm(`Delete game: ${g.a} vs ${g.b}?`)){

    l.games.splice(i,1);

    save();

    renderLeague(l);
  }
}

function deleteLeague(id){

  if(confirm("Delete this league?")){

    db.leagues=
      db.leagues.filter(x=>x.id!==id);

    save();

    showLeagues();
  }
}


/* =========================
   TOURNAMENTS
========================= */

function showTournaments(){

  setActive("navTournaments");

  app(`

  <div class="row" style="margin-bottom:12px">

    <button onclick="newTournament()">
      + New Tournament
    </button>

  </div>

  ${db.tournaments.map(t=>`

    <div class="card">

      <h3>${esc(t.name)}</h3>

      <div class="muted">
        ${t.teams.length} teams •
        ${
          t.mode==="pool"
          ? "Pool Play → Bracket"
          : "Bracket"
        }
      </div>

      <br>

      <button onclick="openTournament('${t.id}')">
        Open
      </button>

    </div>

  `).join("") || `

    <div class="card empty">
      No tournaments yet.
    </div>

  `}

  `);
}

function newTournament(){

  const name=prompt("Tournament name?");

  if(!name)return;

  const choice=prompt(
    "Tournament type:\n\n"+
    "1 = Bracket only\n"+
    "2 = Pool Play → Bracket"
  );

  if(choice!=="1"&&choice!=="2")
    return;

  let t={
    id:crypto.randomUUID(),
    name,
    teams:[],
    games:[],
    rounds:[],
    mode:choice==="2"?"pool":"bracket",
    pools:[],
    poolCount:0
  };

  db.tournaments.push(t);

  save();

  openTournament(t.id);
}

function openTournament(id){

  let t=db.tournaments.find(x=>x.id===id);

  current=t;

  setActive("navTournaments");

  renderTournament(t);
}


/* =========================
   TOURNAMENT TEAMS
========================= */

function addTeamTournament(id){

  let t=db.tournaments.find(x=>x.id===id);

  let n=prompt("Team name?");

  if(!n)return;

  if(!t.teams.includes(n))
    t.teams.push(n);

  save();

  renderTournament(t);
}

function removeTeamTournament(id,en){

  let t=db.tournaments.find(x=>x.id===id);

  let n=decodeURIComponent(en);

  if(confirm("Remove "+n+"?")){

    t.teams=t.teams.filter(x=>x!==n);

    t.games=t.games.filter(
      g=>g.a!==n&&g.b!==n
    );

    save();

    renderTournament(t);
  }
}


/* =========================
   TOURNAMENT RENDER
========================= */

function renderTournament(t){

  if(t.mode==="pool"){
    renderPoolTournament(t);
    return;
  }

  renderBracketTournament(t);
}

function renderBracketTournament(t){

  app(`

  <div class="row">

    <button class="secondary"
      onclick="showTournaments()">
      ← Tournaments
    </button>

    <button onclick="addTeamTournament('${t.id}')">
      + Team
    </button>

    <button onclick="generateBracket('${t.id}')">
      Generate Bracket
    </button>

    <button class="danger"
      onclick="deleteTournament('${t.id}')">
      Delete
    </button>

  </div>


  <div class="card">

    <h2>${esc(t.name)}</h2>

    <div class="muted">
      Bracket Tournament
    </div>

  </div>


  <div class="card">

    <h3>Teams</h3>

    ${t.teams.map(n=>`

      <div class="team">

        <span>${esc(n)}</span>

        <button class="danger"
          onclick="removeTeamTournament(
            '${t.id}',
            '${encodeURIComponent(n)}'
          )">
          Remove
        </button>

      </div>

    `).join("")||`

      <div class="empty">
        Add teams first.
      </div>

    `}

  </div>


  <div class="card">

    <h3>Editable Bracket</h3>

    ${
      t.rounds.length
      ?
      `<div class="bracket">

        ${t.rounds.map((r,ri)=>`

          <div class="round">

            <h3>
              ${
                ri===t.rounds.length-1
                ?"Final"
                :"Round "+(ri+1)
              }
            </h3>

            ${r.map((m,mi)=>`

              <div class="match">

                <div class="slot ${
                  m.winner===m.a&&m.a
                  ?"winner":""
                }">

                  ${esc(m.a||"TBD")}

                  <input
                    style="width:48px;padding:5px"
                    type="number"
                    value="${esc(m.as)}"
                    onchange="
                      setMatchScore(
                        '${t.id}',
                        ${ri},
                        ${mi},
                        'a',
                        this.value
                      )
                    "
                  >

                </div>


                <div class="slot ${
                  m.winner===m.b&&m.b
                  ?"winner":""
                }">

                  ${esc(m.b||"TBD")}

                  <input
                    style="width:48px;padding:5px"
                    type="number"
                    value="${esc(m.bs)}"
                    onchange="
                      setMatchScore(
                        '${t.id}',
                        ${ri},
                        ${mi},
                        'b',
                        this.value
                      )
                    "
                  >

                </div>

              </div>

            `).join("")}

          </div>

        `).join("")}

      </div>`
      :
      `<div class="empty">
        Add teams & generate bracket
      </div>`
    }

  </div>

  `);
}

function generateBracket(id){

  let t=db.tournaments.find(x=>x.id===id);

  if(t.teams.length<2)
    return alert("Add at least 2 teams first.");

  let r=[];

  let teams=[...t.teams].sort(()=>Math.random()-.5);

  while(teams.length>1){

    let round=[];

    for(let i=0;i<teams.length;i+=2){

      if(i+1<teams.length){

        round.push({
          a:teams[i],
          b:teams[i+1],
          as:0,
          bs:0,
          winner:null
        });

      }else{

        round.push({
          a:teams[i],
          b:null,
          as:0,
          bs:0,
          winner:null
        });

      }
    }

    r.push(round);

    teams=round.map(m=>m.winner||m.a);
  }

  t.rounds=r;

  save();

  renderTournament(t);
}

function setMatchScore(tid,ri,mi,slot,val){

  let t=db.tournaments.find(x=>x.id===tid);

  let m=t.rounds[ri][mi];

  if(slot==="a")m.as=Number(val);

  if(slot==="b")m.bs=Number(val);

  if(m.a&&m.b){

    if(m.as>m.bs)m.winner=m.a;

    else if(m.bs>m.as)m.winner=m.b;

    else m.winner=null;
  }

  if(ri<t.rounds.length-1){

    let nextRound=t.rounds[ri+1];

    let nextSlot=Math.floor(mi/2);

    let isSecond=mi%2===1;

    if(!nextRound[nextSlot]){

      nextRound[nextSlot]={
        a:null,
        b:null,
        as:0,
        bs:0,
        winner:null
      };
    }

    if(isSecond){

      nextRound[nextSlot].b=m.winner;

    }else{

      nextRound[nextSlot].a=m.winner;

    }
  }

  save();

  renderTournament(t);
}

function deleteTournament(id){

  if(confirm("Delete this tournament?")){

    db.tournaments=
      db.tournaments.filter(x=>x.id!==id);

    save();

    showTournaments();
  }
}

function renderPoolTournament(t){

  if(!t.pools||!t.pools.length){

    return app(`

    <div class="row">

      <button class="secondary"
        onclick="showTournaments()">
        ← Tournaments
      </button>

      <button onclick="addTeamTournament('${t.id}')">
        + Team
      </button>

      <button onclick="generatePools('${t.id}')">
        Generate Pools
      </button>

      <button class="danger"
        onclick="deleteTournament('${t.id}')">
        Delete
      </button>

    </div>

    <div class="card">

      <h2>${esc(t.name)}</h2>

      <div class="muted">
        Pool Play → Bracket
      </div>

    </div>

    <div class="card">

      <h3>Teams</h3>

      ${t.teams.map(n=>`

        <div class="team">

          <span>${esc(n)}</span>

          <button class="danger"
            onclick="removeTeamTournament(
              '${t.id}',
              '${encodeURIComponent(n)}'
            )">
            Remove
          </button>

        </div>

      `).join("")||`

        <div class="empty">
          Add teams first.
        </div>

      `}

    </div>

    `);
  }

  app(`

  <div class="row">

    <button class="secondary"
      onclick="showTournaments()">
      ← Tournaments
    </button>

    <button onclick="addTeamTournament('${t.id}')">
      + Team
    </button>

    <button class="danger"
      onclick="clearPools('${t.id}')">
      Reset Pools
    </button>

    <button class="danger"
      onclick="deleteTournament('${t.id}')">
      Delete
    </button>

  </div>

  <div class="card">

    <h2>${esc(t.name)}</h2>

  </div>

  ${t.pools.map((p,pi)=>`

    <div class="card">

      <h3>Pool ${String.fromCharCode(65+pi)}</h3>

      <table>

        <tr>
          <th>Team</th>
          <th>W</th>
          <th>L</th>
          <th>T</th>
          <th>Pts</th>
        </tr>

        ${p.standings.map(s=>`

          <tr>
            <td><b>${esc(s.team)}</b></td>
            <td>${s.w}</td>
            <td>${s.l}</td>
            <td>${s.t}</td>
            <td>${s.pts}</td>
          </tr>

        `).join("")}

      </table>

      <h4 style="margin:12px 0 8px">Games</h4>

      ${p.games.map((g,gi)=>`

        <div class="team">

          <span>
            ${esc(g.a)}
            <b>${g.as}</b>
            —
            <b>${g.bs}</b>
            ${esc(g.b)}
          </span>

          <div class="row">
            <button class="secondary"
              onclick="editPoolGame('${t.id}',${pi},${gi})">
              Edit
            </button>
          </div>

        </div>

      `).join("")}

      <button
        style="margin-top:8px"
        onclick="addPoolGame('${t.id}',${pi})">
        + Game
      </button>

    </div>

  `).join("")}

  <div class="card">

    <button onclick="bracketsFromPools('${t.id}')">
      Generate Brackets from Pools
    </button>

  </div>

  `);
}

function generatePools(tid){

  let t=db.tournaments.find(x=>x.id===tid);

  if(t.teams.length<2)
    return alert("Add teams first");

  t.poolCount=prompt(
    "Number of pools?",
    Math.ceil(Math.sqrt(t.teams.length))
  );

  if(!t.poolCount)return;

  t.poolCount=Number(t.poolCount);

  t.pools=[];

  let teams=[...t.teams].sort(()=>Math.random()-.5);

  for(let p=0;p<t.poolCount;p++){

    t.pools.push({
      teams:[],
      games:[],
      standings:[]
    });
  }

  teams.forEach((team,i)=>{
    t.pools[i%t.poolCount].teams.push(team);
  });

  t.pools.forEach(p=>{

    p.standings=p.teams.map(n=>({
      team:n,
      w:0,
      l:0,
      t:0,
      pts:0
    }));
  });

  save();

  renderPoolTournament(t);
}

function addPoolGame(tid,pi){

  let t=db.tournaments.find(x=>x.id===tid);

  let p=t.pools[pi];

  if(p.teams.length<2)
    return alert("Add teams first");

  app(`

  <div class="card">

    <h2>Add Pool Game</h2>

    <div class="field">

      <label>Team 1</label>

      <select id="poolTeam1">

        <option value="">
          Select
        </option>

        ${p.teams.map((te,i)=>`
          <option value="${i}">
            ${esc(te)}
          </option>
        `).join("")}

      </select>

    </div>

    <div class="field">

      <label>Score</label>

      <input
        id="poolScore1"
        type="number"
        min="0"
      >

    </div>

    <div class="field">

      <label>Team 2</label>

      <select id="poolTeam2">

        <option value="">
          Select
        </option>

        ${p.teams.map((te,i)=>`
          <option value="${i}">
            ${esc(te)}
          </option>
        `).join("")}

      </select>

    </div>

    <div class="field">

      <label>Score</label>

      <input
        id="poolScore2"
        type="number"
        min="0"
      >

    </div>

    <div class="row">

      <button onclick="savePoolGame('${tid}',${pi})">
        Save
      </button>

      <button class="secondary"
        onclick="renderPoolTournament(
          db.tournaments.find(x=>x.id==='${tid}')
        )">
        Cancel
      </button>

    </div>

  </div>
  `);
}

function savePoolGame(tid,pi){

  let t=db.tournaments.find(x=>x.id===tid);

  let p=t.pools[pi];

  let a1=Number(document.getElementById("poolTeam1").value);

  let a2=Number(document.getElementById("poolTeam2").value);

  let s1=Number(document.getElementById("poolScore1").value);

  let s2=Number(document.getElementById("poolScore2").value);

  if(a1===""||a2==="")return alert("Select teams");

  if(a1===a2)return alert("Select different teams");

  p.games.push({
    a:p.teams[a1],
    b:p.teams[a2],
    as:s1,
    bs:s2
  });

  updatePoolStandings(p);

  save();

  renderPoolTournament(t);
}

function editPoolGame(tid,pi,gi){

  let t=db.tournaments.find(x=>x.id===tid);

  let p=t.pools[pi];

  let g=p.games[gi];

  let a=prompt("Team 1",g.a);

  if(!p.teams.includes(a))return;

  let b=prompt("Team 2",g.b);

  if(!p.teams.includes(b)||a===b)return;

  let s1=Number(prompt("Score for "+a,g.as));

  let s2=Number(prompt("Score for "+b,g.bs));

  if(Number.isFinite(s1)&&Number.isFinite(s2)){

    g.a=a;
    g.b=b;
    g.as=s1;
    g.bs=s2;

    updatePoolStandings(p);

    save();

    renderPoolTournament(t);
  }
}

function updatePoolStandings(p){

  p.standings.forEach(s=>{
    s.w=0;
    s.l=0;
    s.t=0;
    s.pts=0;
  });

  p.games.forEach(g=>{

    let st1=p.standings.find(s=>s.team===g.a);
    let st2=p.standings.find(s=>s.team===g.b);

    if(!st1||!st2)return;

    if(g.as>g.bs){
      st1.w++;
      st2.l++;
      st1.pts+=3;
    }else if(g.bs>g.as){
      st2.w++;
      st1.l++;
      st2.pts+=3;
    }else{
      st1.t++;
      st2.t++;
      st1.pts++;
      st2.pts++;
    }
  });

  p.standings.sort((a,b)=>b.pts-a.pts);
}

function clearPools(tid){

  if(!confirm("Reset pools?"))return;

  let t=db.tournaments.find(x=>x.id===tid);

  t.pools=[];

  t.poolCount=0;

  save();

  renderPoolTournament(t);
}

function bracketsFromPools(tid){

  let t=db.tournaments.find(x=>x.id===tid);

  if(!t.pools||!t.pools.length)
    return alert("Generate pools first");

  let qualified=[];

  t.pools.forEach(p=>{
    if(p.standings.length>0)
      qualified.push(p.standings[0].team);
  });

  if(qualified.length<2)
    return alert("Not enough pool winners");

  t.teams=qualified;

  generateBracket(tid);

  renderTournament(t);
}
