<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>League Box</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#111827}
header{background:#111827;color:white;padding:18px 18px 16px;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:25px}.sub{opacity:.7;font-size:13px;margin-top:3px}
main{max-width:850px;margin:auto;padding:16px 14px 90px}
.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #0000000a}
button,input,select{font:inherit}
button{border:0;border-radius:11px;padding:11px 14px;background:#111827;color:white;font-weight:600;cursor:pointer}
button.secondary{background:#e5e7eb;color:#111827}
button.danger{background:#fee2e2;color:#991b1b}
.row{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:#6b7280;font-size:13px}
input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;background:white}
.field{margin:8px 0}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav button{background:transparent;color:#6b7280;padding:8px;font-size:12px}
nav button.active{color:#111827}
h2{margin:3px 0 12px;font-size:19px}
h3{margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid #eee}
th{font-size:11px;color:#6b7280;text-transform:uppercase}
.team{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.bracket{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.round{min-width:205px}
.match{background:#f9fafb;border:1px solid #dfe3e8;border-radius:12px;padding:9px;margin:8px 0}
.match .slot{display:flex;justify-content:space-between;gap:5px;padding:6px;border-radius:8px}
.match .winner{font-weight:800;background:#e5e7eb}
.small{font-size:12px}
.empty{padding:25px;text-align:center;color:#6b7280}
.scoreGrid{display:grid;grid-template-columns:1fr;gap:8px;align-items:stretch}
.scoreGrid label{font-weight:700;font-size:13px;margin-bottom:2px;display:block}
.scoreGrid select{margin-bottom:0}
.scoreGrid input{margin-bottom:0}
.teamLink{cursor:pointer;text-decoration:underline;color:#111827}
.teamLink:hover{opacity:.7}
.debugBtn{background:transparent;color:#6b7280;border:1px dashed #ddd;padding:6px;border-radius:8px;font-size:12px}
.debugArea{width:100%;height:220px;padding:10px;border:1px solid #ddd;border-radius:8px;font-family:monospace;white-space:pre-wrap;overflow:auto}
</style>
</head>

<body>

<header>
<h1>League Box</h1>
<div class="sub">Teams, scores, standings & editable brackets</div>
</header>

<main id="app"></main>

<nav>
<button id="navHome" onclick="showHome()" class="active">⌂<br>Home</button>
<button id="navLeagues" onclick="showLeagues()">▤<br>Leagues</button>
<button id="navTournaments" onclick="showTournaments()">🏆<br>Tournaments</button>
</nav>

<script>

const KEY="leaguebox-v1";

let db=JSON.parse(localStorage.getItem(KEY)||'{"leagues":[],"tournaments":[]}');

db.leagues.forEach(l=>{
  if(!l.games)l.games=[];
});

db.tournaments.forEach(t=>{
  if(!t.games)t.games=[];
  if(!t.rounds)t.rounds=[];
  if(!t.mode)t.mode="bracket";
  if(!t.pools)t.pools=[];
  if(!t.poolCount)t.poolCount=0;
});

let current=null;

const save=()=>localStorage.setItem(KEY,JSON.stringify(db));

const esc=s=>String(s??"").replace(/[&<>\"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
}[m]));

function app(x){
  document.getElementById("app").innerHTML=x;
}

function setActive(id){
  document.querySelectorAll("nav button")
    .forEach(x=>x.classList.remove("active"));

  document.getElementById(id)?.classList.add("active");
}


/* =========================
   HOME
========================= */

function showHome(){

  setActive("navHome");

  app(`
  <div class="card">
    <h2>Welcome to League Box</h2>
    <p class="muted">
      Create a league or tournament, add teams, then enter scores.
      League Box handles the standings automatically.
    </p>

    <div class="row">
      <button onclick="newLeague()">+ League</button>
      <button onclick="newTournament()">+ Tournament</button>
      <button class="secondary" onclick="showDebug()">Debug</button>
    </div>
  </div>

  ${db.leagues.length?`
  <div class="card">
    <h3>Your leagues</h3>

    ${db.leagues.map(l=>`
      <div class="team">
        <span>
          <b>${esc(l.name)}</b><br>
          <span class="muted">${l.teams.length} teams</span>
        </span>

        <button class="secondary"
          onclick="openLeague('${l.id}')">
          Open
        </button>
      </div>
    `).join("")}
  </div>`:""}

  ${db.tournaments.length?`
  <div class="card">
    <h3>Your tournaments</h3>

    ${db.tournaments.map(t=>`
      <div class="team">
        <span>
          <b>${esc(t.name)}</b><br>
          <span class="muted">
            ${t.teams.length} teams
          </span>
        </span>

        <button class="secondary"
          onclick="openTournament('${t.id}')">
          Open
        </button>
      </div>
    `).join("")}
  </div>`:""}
  `);
}

/* Debug / repair UI (mobile friendly)
   - Shows raw saved JSON (if any) so you can copy it
   - Attempt automatic repair and overwrite saved key if repair succeeds
   - Allows pasting edited JSON and saving it back (so you can fix manually)
*/
function showDebug(){
  const raw = localStorage.getItem(KEY) || '';
  app(`
    <div class="card">
      <h2>Debug / Repair</h2>
      <div class="muted">You can copy your saved data, try an automatic repair, or paste fixed JSON below and restore it. This does not delete backups.</div>

      <div style="margin-top:12px">
        <label style="font-weight:700;display:block;margin-bottom:6px">Saved JSON (editable)</label>
        <textarea id="debugArea" class="debugArea">${esc(raw)}</textarea>
      </div>

      <div class="row" style="margin-top:12px">
        <button onclick="attemptAutoRecover()">Attempt Auto-Recover</button>
        <button class="secondary" onclick="saveEditedDebug()">Save Edited JSON</button>
        <button class="danger" onclick="backupThenReset()">Backup & Reset (if broken)</button>
      </div>

      <div style="margin-top:12px" class="muted small">If auto-recover succeeds, the app will save a cleaned copy and reload. If it fails, a backup key will be saved as <code>leaguebox-v1.broken.[...]

      <div style="margin-top:12px">
        <button class="secondary" onclick="showHome()">Close</button>
      </div>
    </div>
  `);
}

function attemptAutoRecover(){
  const raw = localStorage.getItem(KEY);
  if(!raw){
    alert('No data saved yet.');
    return;
  }

  try{
    JSON.parse(raw);
    alert('Saved data parses as valid JSON. No action taken. Try closing this panel.');
    return;
  }catch(e){
    // try simple recover steps
    let recovered = null;
    try{
      let s = raw.replace(/,\s*([}\]])/g, '$1');
      s = s.replace(/\r?\n/g, ' ');
      s = s.replace(/'/g, '"');
      recovered = JSON.parse(s);
    }catch(e2){
      recovered = null;
    }

    if(recovered && typeof recovered === 'object'){
      // save backup of raw
      const backupKey = KEY + '.broken.' + Date.now();
      try{ localStorage.setItem(backupKey, raw); }catch(e3){ console.error('backup failed', e3); }
      localStorage.setItem(KEY, JSON.stringify(recovered));
      alert('Recovered saved data and wrote a normalized copy. A backup of the original was saved as ' + backupKey + '. Reloading...');
      location.reload();
      return;
    }

    // couldn't recover
    const backupKey = KEY + '.broken.' + Date.now();
    try{ localStorage.setItem(backupKey, raw); alert('Could not auto-recover. A backup was saved as ' + backupKey + '. You can paste a fixed JSON into the box and press Save Edited JSON.'); }
    catch(e4){ alert('Could not auto-recover and failed to save backup. You can copy the JSON from the box and paste it somewhere safe.'); }
  }
}

function saveEditedDebug(){
  const txt = document.getElementById('debugArea').value;
  try{
    const parsed = JSON.parse(txt);
    // basic validation
    if(!Array.isArray(parsed.leagues)) parsed.leagues = Array.isArray(parsed.leagues) ? parsed.leagues : [];
    if(!Array.isArray(parsed.tournaments)) parsed.tournaments = Array.isArray(parsed.tournaments) ? parsed.tournaments : [];
    localStorage.setItem(KEY, JSON.stringify(parsed));
    alert('Saved edited JSON to localStorage. Reloading...');
    location.reload();
  }catch(e){
    alert('Invalid JSON: ' + e.message);
  }
}

function backupThenReset(){
  const raw = localStorage.getItem(KEY) || '';
  const backupKey = KEY + '.broken.' + Date.now();
  try{
    localStorage.setItem(backupKey, raw);
    // Do not delete the original, just reset runtime db so app can run without overwriting user's key
    localStorage.removeItem(KEY);
    alert('Backup saved as ' + backupKey + '. The app will reload with an empty DB so you can recreate or restore. The original raw value is still in localStorage under the backup key.');
    location.reload();
  }catch(e){
    alert('Failed to backup/reset: ' + e.message);
  }
}

/* =========================
   LEAGUES
========================= */

function showLeagues(){

  setActive("navLeagues");

  app(`
  <div class="row" style="margin-bottom:12px">
    <button onclick="newLeague()">+ New League</button>
  </div>

  ${db.leagues.map(l=>`
    <div class="card">
      <h3>${esc(l.name)}</h3>

      <div class="muted">
        ${l.teams.length} teams • ${l.games.length} games
      </div>

      <br>

      <button onclick="openLeague('${l.id}')">
        Open
      </button>
    </div>
  `).join("") || `
    <div class="card empty">
      No leagues yet.
    </div>
  `}
  `);
}

function newLeague(){

  const name=prompt("League name?");

  if(!name)return;

  let l={
    id:crypto.randomUUID(),
    name,
    teams:[],
    games:[]
  };

  db.leagues.push(l);

  save();

  openLeague(l.id);
}

function openLeague(id){

  let l=db.leagues.find(x=>x.id===id);

  current=l;

  setActive("navLeagues");

  renderLeague(l);
}

function getLeagueStats(l){

  let stats={};

  l.teams.forEach(n=>{
    stats[n]={
      w:0,
      l:0,
      t:0,
      pf:0,
      pa:0,
      g:0
    };
  });

  l.games.forEach(g=>{

    if(!stats[g.a]||!stats[g.b])return;

    stats[g.a].g++;
    stats[g.b].g++;

    stats[g.a].pf+=Number(g.as);
    stats[g.a].pa+=Number(g.bs);

    stats[g.b].pf+=Number(g.bs);
    stats[g.b].pa+=Number(g.as);

    if(g.as>g.bs){

      stats[g.a].w++;
      stats[g.b].l++;

    }else if(g.bs>g.as){

      stats[g.b].w++;
      stats[g.a].l++;

    }else{

      stats[g.a].t++;
      stats[g.b].t++;

    }
  });

  return stats;
}

function renderLeague(l){

  // Ensure every game has an id so handlers can reliably reference them
  l.games.forEach(g=>{ if(!g.id) g.id = crypto.randomUUID(); });
  save();

  let stats=getLeagueStats(l);

  let rows=l.teams.map(n=>({
    n,
    ...stats[n],
    diff:stats[n].pf-stats[n].pa,
    points:stats[n].w*3+stats[n].t
  }))
  .sort((a,b)=>
    b.points-a.points ||
    b.diff-a.diff ||
    b.pf-a.pf
  );

  app(`

  <div class="row">

    <button class="secondary"
      onclick="showLeagues()">
      ← Leagues
    </button>

    <button class="danger"
      onclick="deleteLeague('${l.id}')">
      Delete
    </button>

  </div>

  <div class="card">

    <h2>${esc(l.name)}</h2>

    <div class="row">

      <button onclick="addTeamLeague('${l.id}')">
        + Team
      </button>

      <button onclick="addGame('${l.id}')">
        + Score
      </button>

    </div>

  </div>

  <div class="card">

    <h3>Standings</h3>

    ${rows.length?`

    <table>

      <tr>
        <th>#</th>
        <th>Team</th>
        <th>GP</th>
        <th>W</th>
        <th>L</th>
        <th>T</th>
        <th>PF</th>
        <th>PA</th>
        <th>+/-</th>
        <th>Pts</th>
      </tr>

      ${rows.map((r,i)=>`

      <tr>

        <td>${i+1}</td>

        <td>
          <b class="teamLink" onclick="showTeamHistory('${l.id}','${encodeURIComponent(r.n)}')">${esc(r.n)}</b>
        </td>

        <td>${r.g}</td>
        <td>${r.w}</td>
        <td>${r.l}</td>
        <td>${r.t}</td>

        <td>${r.pf}</td>
        <td>${r.pa}</td>
        <td>${r.diff}</td>

        <td><b>${r.points}</b></td>

      </tr>

      `).join("")}

    </table>

    <p class="muted">
      Win = 3 points • Tie = 1 point • Loss = 0
    </p>

    `:`
      <div class="empty">
        Add teams to start.
      </div>
    `}

  </div>


  <div class="card">

    <h3>Games</h3>

    ${l.games.map((g,i)=>`

      <div class="team">

        <span>
          ${esc(g.a)}
          <b>${g.as}</b>
          —
          <b>${g.bs}</b>
          ${esc(g.b)}

          ${
            g.as===g.bs
            ? `<span class="muted"> TIE</span>`
            : ""
          }
        </span>

        <div class="row">
          <button class="secondary"
            onclick="editGameById('${l.id}','${g.id}')">
            Edit
          </button>

          <button class="danger"
            onclick="deleteGameById('${l.id}','${g.id}')">
            Delete
          </button>
        </div>

      </div>

    `).join("") || `
      <div class="empty">
        No scores yet.
      </div>
    `}

  </div>


  <div class="card">

    <h3>Teams</h3>

    ${l.teams.map(n=>`

      <div class="team">

        <span>${esc(n)}</span>

        <button class="danger"
          onclick="removeTeamLeague(
            '${l.id}',
            '${encodeURIComponent(n)}'
          )">
          Remove
        </button>

      </div>

    `).join("")}

  </div>
  `);
}

function showTeamHistory(leagueId, encodedTeamName){

  let l=db.leagues.find(x=>x.id===leagueId);
  let teamName=decodeURIComponent(encodedTeamName);

  // Ensure ids exist for games
  l.games.forEach(g=>{ if(!g.id) g.id = crypto.randomUUID(); });
  save();

  let games=l.games.filter(g=>g.a===teamName || g.b===teamName);

  app(`

  <div class="row">

    <button class="secondary"
      onclick="renderLeague(
        db.leagues.find(x=>x.id==='${leagueId}')
      )">
      ← Back
    </button>

  </div>

  <div class="card">

    <h2>${esc(teamName)}</h2>
    <div class="muted">Game History</div>

  </div>

  <div class="card">

    <h3>Previous Games</h3>

    ${games.length?`

      ${games.map((g,i)=>`

        <div class="team">

          <span>
            ${esc(g.a)}
            <b>${g.as}</b>
            —
            <b>${g.bs}</b>
            ${esc(g.b)}

            ${
              g.as===g.bs
              ? `<span class="muted"> TIE</span>`
              : g.a===teamName && g.as>g.bs
              ? `<span class="muted"> W</span>`
              : g.b===teamName && g.bs>g.as
              ? `<span class="muted"> W</span>`
              : `<span class="muted"> L</span>`
            }
          </span>

          <div class="row">
            <button class="secondary"
              onclick="editGameById('${leagueId}','${g.id}')">
              Edit
            </button>

            <button class="danger"
              onclick="deleteGameById('${leagueId}','${g.id}')">
              Delete
            </button>
          </div>

        </div>

      `).join("")}

    `:`
      <div class="empty">
        No games yet.
      </div>
    `}

  </div>
  `);
}

function addTeamLeague(id){

  let l=db.leagues.find(x=>x.id===id);

  let n=prompt("Team name?");

  if(!n)return;

  if(!l.teams.includes(n))
    l.teams.push(n);

  save();

  renderLeague(l);
}

function removeTeamLeague(id,en){

  let l=db.leagues.find(x=>x.id===id);

  let n=decodeURIComponent(en);

  if(confirm("Remove "+n+"?")){

    l.teams=l.teams.filter(x=>x!==n);

    l.games=l.games.filter(
      g=>g.a!==n&&g.b!==n
    );

    save();

    renderLeague(l);
  }
}

/* =========================
   GAME MANAGEMENT
========================= */

function addGame(id){
  let l=db.leagues.find(x=>x.id===id);
  
  if(l.teams.length < 2){
    alert("Need at least 2 teams to add a game");
    return;
  }

  app(`
    <div class="row">
      <button class="secondary" onclick="renderLeague(db.leagues.find(x=>x.id==='${id}'))">
        ← Back
      </button>
    </div>

    <div class="card">
      <h2>Add Score</h2>
      
      <div class="scoreGrid">
        <label>Team A</label>
        <select id="teamA">
          <option value="">Select team...</option>
          ${l.teams.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join("")}
        </select>
        
        <label>Score A</label>
        <input id="scoreA" type="number" value="0" min="0">
        
        <label>Team B</label>
        <select id="teamB">
          <option value="">Select team...</option>
          ${l.teams.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join("")}
        </select>
        
        <label>Score B</label>
        <input id="scoreB" type="number" value="0" min="0">
      </div>

      <div class="row" style="margin-top:12px">
        <button onclick="saveGame('${id}')">Save Game</button>
        <button class="secondary" onclick="renderLeague(db.leagues.find(x=>x.id==='${id}'))">Cancel</button>
      </div>
    </div>
  `);
}

function saveGame(id){
  let l=db.leagues.find(x=>x.id===id);
  
  let a=document.getElementById("teamA").value;
  let b=document.getElementById("teamB").value;
  let as=document.getElementById("scoreA").value;
  let bs=document.getElementById("scoreB").value;

  if(!a || !b){
    alert("Select both teams");
    return;
  }

  if(a===b){
    alert("Teams must be different");
    return;
  }

  l.games.push({
    id: crypto.randomUUID(),
    a,
    b,
    as: Number(as),
    bs: Number(bs)
  });

  save();
  renderLeague(l);
}

function editGameById(id, gameId){
  let l=db.leagues.find(x=>x.id===id);
  let g=l.games.find(x=>x.id===gameId);

  if(!g) return;

  app(`
    <div class="row">
      <button class="secondary" onclick="renderLeague(db.leagues.find(x=>x.id==='${id}'))">
        ← Back
      </button>
    </div>

    <div class="card">
      <h2>Edit Score</h2>
      
      <div class="scoreGrid">
        <label>Team A</label>
        <select id="teamA">
          ${l.teams.map(t=>`<option value="${esc(t)}" ${t===g.a?'selected':''}>${esc(t)}</option>`).join("")}
        </select>
        
        <label>Score A</label>
        <input id="scoreA" type="number" value="${g.as}" min="0">
        
        <label>Team B</label>
        <select id="teamB">
          ${l.teams.map(t=>`<option value="${esc(t)}" ${t===g.b?'selected':''}>${esc(t)}</option>`).join("")}
        </select>
        
        <label>Score B</label>
        <input id="scoreB" type="number" value="${g.bs}" min="0">
      </div>

      <div class="row" style="margin-top:12px">
        <button onclick="updateGame('${id}','${gameId}')">Save Changes</button>
        <button class="secondary" onclick="renderLeague(db.leagues.find(x=>x.id==='${id}'))">Cancel</button>
      </div>
    </div>
  `);
}

function updateGame(id, gameId){
  let l=db.leagues.find(x=>x.id===id);
  let g=l.games.find(x=>x.id===gameId);

  if(!g) return;

  let a=document.getElementById("teamA").value;
  let b=document.getElementById("teamB").value;
  let as=document.getElementById("scoreA").value;
  let bs=document.getElementById("scoreB").value;

  if(!a || !b){
    alert("Select both teams");
    return;
  }

  if(a===b){
    alert("Teams must be different");
    return;
  }

  g.a = a;
  g.b = b;
  g.as = Number(as);
  g.bs = Number(bs);

  save();
  renderLeague(l);
}

function deleteGameById(id, gameId){
  if(confirm("Delete this game?")){
    let l=db.leagues.find(x=>x.id===id);
    l.games = l.games.filter(x=>x.id!==gameId);
    save();
    renderLeague(l);
  }
}

function deleteLeague(id){
  if(confirm("Delete this entire league?")){
    db.leagues = db.leagues.filter(x=>x.id!==id);
    save();
    showLeagues();
  }
}

/* =========================
   TOURNAMENTS (placeholder)
========================= */

function showTournaments(){
  setActive("navTournaments");
  app(`
    <div class="card">
      <h2>Tournaments</h2>
      <p class="muted">Tournament features coming soon</p>
    </div>
  `);
}

function newTournament(){
  alert("Tournament features coming soon");
}

function openTournament(id){
  alert("Tournament features coming soon");
}

</script>
</body>
</html>
