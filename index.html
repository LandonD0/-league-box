<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>League Box</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#111827}
header{background:#111827;color:white;padding:18px 18px 16px;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:25px}.sub{opacity:.7;font-size:13px;margin-top:3px}
main{max-width:850px;margin:auto;padding:16px 14px 90px}
.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #0000000a}
button,input,select{font:inherit}
button{border:0;border-radius:11px;padding:11px 14px;background:#111827;color:white;font-weight:600;cursor:pointer}
button.secondary{background:#e5e7eb;color:#111827}
button.danger{background:#fee2e2;color:#991b1b}
.row{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:#6b7280;font-size:13px}
input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;background:white}
.field{margin:8px 0}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav button{background:transparent;color:#6b7280;padding:8px;font-size:12px}
nav button.active{color:#111827}
h2{margin:3px 0 12px;font-size:19px}
h3{margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid #eee}
th{font-size:11px;color:#6b7280;text-transform:uppercase}
.team{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.bracket{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.round{min-width:205px}
.match{background:#f9fafb;border:1px solid #dfe3e8;border-radius:12px;padding:9px;margin:8px 0}
.match .slot{display:flex;justify-content:space-between;gap:5px;padding:6px;border-radius:8px}
.match .winner{font-weight:800;background:#e5e7eb}
.small{font-size:12px}
.empty{padding:25px;text-align:center;color:#6b7280}
.scoreGrid{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center}
.scoreGrid select{margin-bottom:8px}
.scoreGrid input{margin-bottom:8px}
.teamLink{cursor:pointer;text-decoration:underline;color:#111827}
.teamLink:hover{opacity:.7}
</style>
</head>

<body>

<header>
<h1>League Box</h1>
<div class="sub">Teams, scores, standings & editable brackets</div>
</header>

<main id="app"></main>

<nav>
<button id="navHome" onclick="showHome()" class="active">⌂<br>Home</button>
<button id="navLeagues" onclick="showLeagues()">▤<br>Leagues</button>
<button id="navTournaments" onclick="showTournaments()">🏆<br>Tournaments</button>
</nav>

<script>

const KEY="leaguebox-v1";

let db=JSON.parse(localStorage.getItem(KEY)||'{"leagues":[],"tournaments":[]}');

db.leagues.forEach(l=>{
  if(!l.games)l.games=[];
});

db.tournaments.forEach(t=>{
  if(!t.games)t.games=[];
  if(!t.rounds)t.rounds=[];
  if(!t.mode)t.mode="bracket";
  if(!t.pools)t.pools=[];
  if(!t.poolCount)t.poolCount=0;
});

let current=null;

const save=()=>localStorage.setItem(KEY,JSON.stringify(db));

const esc=s=>String(s??"").replace(/[&<>\"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
}[m]));

function app(x){
  document.getElementById("app").innerHTML=x;
}

function setActive(id){
  document.querySelectorAll("nav button")
    .forEach(x=>x.classList.remove("active"));

  document.getElementById(id)?.classList.add("active");
}


/* =========================
   HOME
========================= */

function showHome(){

  setActive("navHome");

  app(`
  <div class="card">
    <h2>Welcome to League Box</h2>
    <p class="muted">
      Create a league or tournament, add teams, then enter scores.
      League Box handles the standings automatically.
    </p>

    <div class="row">
      <button onclick="newLeague()">+ League</button>
      <button onclick="newTournament()">+ Tournament</button>
    </div>
  </div>

  ${db.leagues.length?`
  <div class="card">
    <h3>Your leagues</h3>

    ${db.leagues.map(l=>`
      <div class="team">
        <span>
          <b>${esc(l.name)}</b><br>
          <span class="muted">${l.teams.length} teams</span>
        </span>

        <button class="secondary"
          onclick="openLeague('${l.id}')">
          Open
        </button>
      </div>
    `).join("")}
  </div>`:""}

  ${db.tournaments.length?`
  <div class="card">
    <h3>Your tournaments</h3>

    ${db.tournaments.map(t=>`
      <div class="team">
        <span>
          <b>${esc(t.name)}</b><br>
          <span class="muted">
            ${t.teams.length} teams
          </span>
        </span>

        <button class="secondary"
          onclick="openTournament('${t.id}')">
          Open
        </button>
      </div>
    `).join("")}
  </div>`:""}
  `);
}


/* =========================
   LEAGUES
========================= */

function showLeagues(){

  setActive("navLeagues");

  app(`
  <div class="row" style="margin-bottom:12px">
    <button onclick="newLeague()">+ New League</button>
  </div>

  ${db.leagues.map(l=>`
    <div class="card">
      <h3>${esc(l.name)}</h3>

      <div class="muted">
        ${l.teams.length} teams • ${l.games.length} games
      </div>

      <br>

      <button onclick="openLeague('${l.id}')">
        Open
      </button>
    </div>
  `).join("") || `
    <div class="card empty">
      No leagues yet.
    </div>
  `}
  `);
}

function newLeague(){

  const name=prompt("League name?");

  if(!name)return;

  let l={
    id:crypto.randomUUID(),
    name,
    teams:[],
    games:[]
  };

  db.leagues.push(l);

  save();

  openLeague(l.id);
}

function openLeague(id){

  let l=db.leagues.find(x=>x.id===id);

  current=l;

  setActive("navLeagues");

  renderLeague(l);
}

function getLeagueStats(l){

  let stats={};

  l.teams.forEach(n=>{
    stats[n]={
      w:0,
      l:0,
      t:0,
      pf:0,
      pa:0,
      g:0
    };
  });

  l.games.forEach(g=>{

    if(!stats[g.a]||!stats[g.b])return;

    stats[g.a].g++;
    stats[g.b].g++;

    stats[g.a].pf+=Number(g.as);
    stats[g.a].pa+=Number(g.bs);

    stats[g.b].pf+=Number(g.bs);
    stats[g.b].pa+=Number(g.as);

    if(g.as>g.bs){

      stats[g.a].w++;
      stats[g.b].l++;

    }else if(g.bs>g.as){

      stats[g.b].w++;
      stats[g.a].l++;

    }else{

      stats[g.a].t++;
      stats[g.b].t++;

    }
  });

  return stats;
}

function renderLeague(l){

  // Ensure every game has an id so handlers can reliably reference them
  l.games.forEach(g=>{ if(!g.id) g.id = crypto.randomUUID(); });
  save();

  let stats=getLeagueStats(l);

  let rows=l.teams.map(n=>({
    n,
    ...stats[n],
    diff:stats[n].pf-stats[n].pa,
    points:stats[n].w*3+stats[n].t
  }))
  .sort((a,b)=>
    b.points-a.points ||
    b.diff-a.diff ||
    b.pf-a.pf
  );

  app(`

  <div class="row">

    <button class="secondary"
      onclick="showLeagues()">
      ← Leagues
    </button>

    <button class="danger"
      onclick="deleteLeague('${l.id}')">
      Delete
    </button>

  </div>

  <div class="card">

    <h2>${esc(l.name)}</h2>

    <div class="row">

      <button onclick="addTeamLeague('${l.id}')">
        + Team
      </button>

      <button onclick="addGame('${l.id}')">
        + Score
      </button>

    </div>

  </div>

  <div class="card">

    <h3>Standings</h3>

    ${rows.length?`

    <table>

      <tr>
        <th>#</th>
        <th>Team</th>
        <th>GP</th>
        <th>W</th>
        <th>L</th>
        <th>T</th>
        <th>PF</th>
        <th>PA</th>
        <th>+/-</th>
        <th>Pts</th>
      </tr>

      ${rows.map((r,i)=>`

      <tr>

        <td>${i+1}</td>

        <td>
          <b class="teamLink" onclick="showTeamHistory('${l.id}','${encodeURIComponent(r.n)}')">${esc(r.n)}</b>
        </td>

        <td>${r.g}</td>
        <td>${r.w}</td>
        <td>${r.l}</td>
        <td>${r.t}</td>

        <td>${r.pf}</td>
        <td>${r.pa}</td>
        <td>${r.diff}</td>

        <td><b>${r.points}</b></td>

      </tr>

      `).join("")}

    </table>

    <p class="muted">
      Win = 3 points • Tie = 1 point • Loss = 0
    </p>

    `:`
      <div class="empty">
        Add teams to start.
      </div>
    `}

  </div>


  <div class="card">

    <h3>Games</h3>

    ${l.games.map((g,i)=>`

      <div class="team">

        <span>
          ${esc(g.a)}
          <b>${g.as}</b>
          —
          <b>${g.bs}</b>
          ${esc(g.b)}

          ${
            g.as===g.bs
            ? `<span class="muted"> TIE</span>`
            : ""
          }
        </span>

        <div class="row">
          <button class="secondary"
            onclick="editGameById('${l.id}','${g.id}')">
            Edit
          </button>

          <button class="danger"
            onclick="deleteGameById('${l.id}','${g.id}')">
            Delete
          </button>
        </div>

      </div>

    `).join("") || `
      <div class="empty">
        No scores yet.
      </div>
    `}

  </div>


  <div class="card">

    <h3>Teams</h3>

    ${l.teams.map(n=>`

      <div class="team">

        <span>${esc(n)}</span>

        <button class="danger"
          onclick="removeTeamLeague(
            '${l.id}',
            '${encodeURIComponent(n)}'
          )">
          Remove
        </button>

      </div>

    `).join("")}

  </div>
  `);
}

function showTeamHistory(leagueId, encodedTeamName){

  let l=db.leagues.find(x=>x.id===leagueId);
  let teamName=decodeURIComponent(encodedTeamName);

  // Ensure ids exist for games
  l.games.forEach(g=>{ if(!g.id) g.id = crypto.randomUUID(); });
  save();

  let games=l.games.filter(g=>g.a===teamName || g.b===teamName);

  app(`

  <div class="row">

    <button class="secondary"
      onclick="renderLeague(
        db.leagues.find(x=>x.id==='${leagueId}')
      )">
      ← Back
    </button>

  </div>

  <div class="card">

    <h2>${esc(teamName)}</h2>
    <div class="muted">Game History</div>

  </div>

  <div class="card">

    <h3>Previous Games</h3>

    ${games.length?`

      ${games.map((g,i)=>`

        <div class="team">

          <span>
            ${esc(g.a)}
            <b>${g.as}</b>
            —
            <b>${g.bs}</b>
            ${esc(g.b)}

            ${
              g.as===g.bs
              ? `<span class="muted"> TIE</span>`
              : g.a===teamName && g.as>g.bs
              ? `<span class="muted"> W</span>`
              : g.b===teamName && g.bs>g.as
              ? `<span class="muted"> W</span>`
              : `<span class="muted"> L</span>`
            }
          </span>

          <div class="row">
            <button class="secondary"
              onclick="editGameById('${leagueId}','${g.id}')">
              Edit
            </button>

            <button class="danger"
              onclick="deleteGameById('${leagueId}','${g.id}')">
              Delete
            </button>
          </div>

        </div>

      `).join("")}

    `:`
      <div class="empty">
        No games yet.
      </div>
    `}

  </div>
  `);
}

function addTeamLeague(id){

  let l=db.leagues.find(x=>x.id===id);

  let n=prompt("Team name?");

  if(!n)return;

  if(!l.teams.includes(n))
    l.teams.push(n);

  save();

  renderLeague(l);
}

function removeTeamLeague(id,en){

  let l=db.leagues.find(x=>x.id===id);

  let n=decodeURIComponent(en);

  if(confirm("Remove "+n+"?")){

    l.teams=l.teams.filter(x=>x!==n);

    l.games=l.games.filter(
      g=>g.a!==n&&g.b!==n
    );

    save();

    renderLeague(l);
  }
}


/* =========================
   LEAGUE SCORE ENTRY
========================= */

function addGame(id){

  let l=db.leagues.find(x=>x.id===id);

  if(l.teams.length<2)
    return alert("Add at least 2 teams first.");

  // Render empty form for new game
  app(`

  <div class="card">

    <h2>Add Score</h2>

    <div class="field">

      <label>Team 1</label>

      <select id="scoreTeam1">

        <option value="">
          Select Team
        </option>

        ${l.teams.map((t,i)=>`
          <option value="${i}">
            ${esc(t)}
          </option>
        `).join("")}

      </select>

    </div>


    <div class="field">

      <label>Team 1 Score</label>

      <input
        id="score1"
        type="number"
        min="0"
        inputmode="numeric"
        placeholder="Enter score"
      >

    </div>


    <div class="field">

      <label>Team 2</label>

      <select id="scoreTeam2">

        <option value="">
          Select Team
        </option>

        ${l.teams.map((t,i)=>`
          <option value="${i}">
            ${esc(t)}
          </option>
        `).join("")}

      </select>

    </div>


    <div class="field">

      <label>Team 2 Score</label>

      <input
        id="score2"
        type="number"
        min="0"
        inputmode="numeric"
        placeholder="Enter score"
      >

    </div>


    <div class="row">

      <button onclick="saveLeagueGame('${l.id}')">
        Save Score
      </button>

      <button class="secondary"
        onclick="renderLeague(
          db.leagues.find(x=>x.id==='${l.id}')
        )">
        Cancel
      </button>

    </div>

  </div>
  `);
}

function saveLeagueGame(id){

  let l=db.leagues.find(x=>x.id===id);

  let aIndex=document.getElementById("scoreTeam1").value;
  let bIndex=document.getElementById("scoreTeam2").value;

  let as=document.getElementById("score1").value;
  let bs=document.getElementById("score2").value;

  if(aIndex===""||bIndex==="")
    return alert("Select both teams.");

  if(aIndex===bIndex)
    return alert("Choose two different teams.");

  if(as===""||bs==="")
    return alert("Enter both scores.");

  as=Number(as);
  bs=Number(bs);

  if(as<0||bs<0)
    return alert("Scores cannot be negative.");

  l.games.push({
    id: crypto.randomUUID(),
    a:l.teams[aIndex],
    b:l.teams[bIndex],
    as,
    bs
  });

  save();

  renderLeague(l);
}

// Open edit form prefilled like the Add Score form
function editGame(id,i){

  let l=db.leagues.find(x=>x.id===id);
  let g=l.games[i];

  if(!g) return alert('Game not found');

  app(`

  <div class="card">

    <h2>Edit Score</h2>

    <div class="field">

      <label>Team 1</label>

      <select id="scoreTeam1">

        ${l.teams.map((t,idx)=>`
          <option value="${idx}" ${t===g.a? 'selected' : ''}>
            ${esc(t)}
          </option>
        `).join("")}

      </select>

    </div>


    <div class="field">

      <label>Team 1 Score</label>

      <input
        id="score1"
        type="number"
        min="0"
        inputmode="numeric"
        value="${g.as}"
      >

    </div>


    <div class="field">

      <label>Team 2</label>

      <select id="scoreTeam2">

        ${l.teams.map((t,idx)=>`
          <option value="${idx}" ${t===g.b? 'selected' : ''}>
            ${esc(t)}
          </option>
        `).join("")}

      </select>

    </div>


    <div class="field">

      <label>Team 2 Score</label>

      <input
        id="score2"
        type="number"
        min="0"
        inputmode="numeric"
        value="${g.bs}"
      >

    </div>


    <div class="row">

      <button onclick="saveEditedGame('${id}',${i})">
        Save Changes
      </button>

      <button class="secondary"
        onclick="renderLeague(
          db.leagues.find(x=>x.id==='${id}')
        )">
        Cancel
      </button>

    </div>

  </div>
  `);
}

function saveEditedGame(id,i){
  let l=db.leagues.find(x=>x.id===id);
  let g=l.games[i];

  if(!g) return alert('Game not found');

  let aIndex=document.getElementById("scoreTeam1").value;
  let bIndex=document.getElementById("scoreTeam2").value;

  let as=document.getElementById("score1").value;
  let bs=document.getElementById("score2").value;

  if(aIndex===""||bIndex==="")
    return alert("Select both teams.");

  if(aIndex===bIndex)
    return alert("Choose two different teams.");

  if(as===""||bs==="")
    return alert("Enter both scores.");

  as=Number(as);
  bs=Number(bs);

  if(as<0||bs<0)
    return alert("Scores cannot be negative.");

  // Update game
  g.a = l.teams[aIndex];
  g.b = l.teams[bIndex];
  g.as = as;
  g.bs = bs;

  save();
  renderLeague(l);
}

function editGameById(leagueId, gameId){
  let l = db.leagues.find(x=>x.id===leagueId);
  let idx = l.games.findIndex(g=>g.id===gameId);
  if(idx===-1) return alert('Game not found');
  editGame(leagueId, idx);
}

function deleteGameById(leagueId, gameId){
  let l = db.leagues.find(x=>x.id===leagueId);
  let idx = l.games.findIndex(g=>g.id===gameId);
  if(idx===-1) return alert('Game not found');
  deleteGame(leagueId, idx);
}

function deleteGame(id,i){

  let l=db.leagues.find(x=>x.id===id);

  let g=l.games[i];

  if(confirm(`Delete game: ${g.a} vs ${g.b}?`)){

    l.games.splice(i,1);

    save();

    renderLeague(l);
  }
}

function deleteLeague(id){

  if(confirm("Delete this league?")){

    db.leagues=
      db.leagues.filter(x=>x.id!==id);

    save();

    showLeagues();
  }
}


/* =========================
   TOURNAMENTS
========================= */

function showTournaments(){

  setActive("navTournaments");

  app(`

  <div class="row" style="margin-bottom:12px">

    <button onclick="newTournament()">
      + New Tournament
    </button>

  </div>

  ${db.tournaments.map(t=>`

    <div class="card">

      <h3>${esc(t.name)}</h3>

      <div class="muted">
        ${t.teams.length} teams •
        ${
          t.mode==="pool"
          ? "Pool Play → Bracket"
          : "Bracket"
        }
      </div>

      <br>

      <button onclick="openTournament('${t.id}')">
        Open
      </button>

    </div>

  `).join("") || `

    <div class="card empty">
      No tournaments yet.
    </div>

  `}

  `);
}

function newTournament(){

  const name=prompt("Tournament name?");

  if(!name)return;

  const choice=prompt(
    "Tournament type:\n\n"+
    "1 = Bracket only\n"+
    "2 = Pool Play → Bracket"
  );

  if(choice!=="1"&&choice!=="2")
    return;

  let t={
    id:crypto.randomUUID(),
    name,
    teams:[],
    games:[],
    rounds:[],
    mode:choice==="2"?"pool":"bracket",
    pools:[],
    poolCount:0
  };

  db.tournaments.push(t);

  save();

  openTournament(t.id);
}

function openTournament(id){

  let t=db.tournaments.find(x=>x.id===id);

  current=t;

  setActive("navTournaments");

  renderTournament(t);
}

function renderTournament(t){

  t.games.forEach(g=>{ if(!g.id) g.id = crypto.randomUUID(); });
  save();

  if(t.mode==="pool"){
    renderPoolPlay(t);
  }else{
    renderBracket(t);
  }
}

function renderPoolPlay(t){

  app(`

  <div class="row">

    <button class="secondary"
      onclick="showTournaments()">
      ← Tournaments
    </button>

    <button class="danger"
      onclick="deleteTournament('${t.id}')">
      Delete
    </button>

  </div>

  <div class="card">

    <h2>${esc(t.name)}</h2>

    <div class="muted">Pool Play</div>

    <div class="row">

      <button onclick="addTeamTournament('${t.id}')">
        + Team
      </button>

      <button onclick="addTournyGame('${t.id}')">
        + Score
      </button>

      ${t.teams.length >= 2 ? `
        <button onclick="generatePools('${t.id}')">
          Generate Pools
        </button>
      ` : ""}

    </div>

  </div>

  ${t.poolCount === 0 ? `
  
  <div class="card">

    <h3>Teams</h3>

    ${t.teams.length ? `

    <table>
      <tr>
        <th>Team</th>
        <th></th>
      </tr>

      ${t.teams.map(team => `
      <tr>
        <td>${esc(team)}</td>
        <td>
          <button class="danger" onclick="removeTeamTournament('${t.id}', '${encodeURIComponent(team)}')">Remove</button>
        </td>
      </tr>
      `).join("")}

    </table>

    ` : `
    <div class="empty">
      No teams yet. Add teams to start.
    </div>
    `}

  </div>

  ` : `
  
  <div class="card">

    <h3>Pools</h3>

    ${t.pools.map((pool, poolIdx) => `

    <div style="margin-bottom: 20px;">

      <h4 style="margin: 0 0 8px;">Pool ${String.fromCharCode(65 + poolIdx)}</h4>

      ${pool.teams.map(team => {
        let poolStats = getPoolTeamStats(t, poolIdx, team);
        return `
        <div class="team">
          <span>
            <b>${esc(team)}</b><br>
            <span class="muted">${poolStats.w}W ${poolStats.l}L ${poolStats.t}T</span>
          </span>
        </div>
        `;
      }).join("")}

    </div>

    `).join("")}

  </div>

  <div class="card">

    <h3>Pool Games</h3>

    ${t.games.length ? `

      ${t.games.map((g,i)=>`

        <div class="team">

          <span>
            ${esc(g.a)}
            <b>${g.as}</b>
            —
            <b>${g.bs}</b>
            ${esc(g.b)}

            ${
              g.as===g.bs
              ? `<span class="muted"> TIE</span>`
              : ""
            }
          </span>

          <div class="row">
            <button class="secondary"
              onclick="editTournyGameById('${t.id}','${g.id}')">

            </button>

            </button>
          </div>

        </div>

      `).join("")}

    ` : `
    <div class="empty">
      No games yet.
    </div>
    `}

  </div>

  ${t.poolCount > 0 ? `
  <div class="row">
    <button onclick="resetPools('${t.id}')">Reset Pools</button>
  </div>
  ` : ""}

  `);
}

function getPoolTeamStats(t, poolIdx, team){
  let stats = {w: 0, l: 0, t: 0, pf: 0, pa: 0};
  
  t.games.forEach(g=>{
    if((g.a === team || g.b === team) && g.pool === poolIdx){
      if(g.a === team){
        stats.pf += g.as;
        stats.pa += g.bs;
        if(g.as > g.bs) stats.w++;
        else if(g.bs > g.as) stats.l++;
        else stats.t++;
      }else{
        stats.pf += g.bs;
        stats.pa += g.as;
        if(g.bs > g.as) stats.w++;
        else if(g.as > g.bs) stats.l++;
        else stats.t++;
      }
    }
  });
  
  return stats;
}

function generatePools(id){
  let t = db.tournaments.find(x=>x.id===id);
  
  if(t.poolCount === 0){
    const poolChoice = prompt("Number of pools?\n\n1, 2, 3, or 4");
    const poolNum = parseInt(poolChoice);
    
    if(![1,2,3,4].includes(poolNum)) return;
    
    t.pools = [];
    for(let i = 0; i < poolNum; i++){
      t.pools.push({teams: []});
    }
    
    let teamsCopy = [...t.teams].sort(() => Math.random() - 0.5);
    teamsCopy.forEach((team, idx) => {
      t.pools[idx % poolNum].teams.push(team);
    });
    
    t.poolCount = poolNum;
    save();
    renderPoolPlay(t);
  }
}

function resetPools(id){
  if(confirm("Reset all pools and games?")){
    let t = db.tournaments.find(x=>x.id===id);
    t.pools = [];
    t.poolCount = 0;
    t.games = [];
    save();
    renderPoolPlay(t);
  }
}

function addTeamTournament(id){

  if(!t.teams.includes(n)) t.teams.push(n);

}

function removeTeamTournament(id, en){
  let t = db.tournaments.find(x=>x.id===id);

  if(confirm("Remove " + n + "?")){
    t.teams = t.teams.filter(x => x !== n);
    t.games = t.games.filter(g => g.a !== n && g.b !== n);
    save();
    renderPoolPlay(t);
  }
}

function saveTournyGame(id){
  let t = db.tournaments.find(x=>x.id===id);
  
  let aIndex = document.getElementById("scoreTeam1").value;
  let bIndex = document.getElementById("scoreTeam2").value;
  
  let as = document.getElementById("score1").value;
  let bs = document.getElementById("score2").value;
  
  if(aIndex==="" || bIndex==="") return alert("Select both teams.");
  if(aIndex === bIndex) return alert("Choose two different teams.");
  if(as==="" || bs==="") return alert("Enter both scores.");
  
  as = Number(as);
  bs = Number(bs);
  
  if(as < 0 || bs < 0) return alert("Scores cannot be negative.");
  
  let pool = t.poolCount > 0 ? Number(document.getElementById("scorePool").value) : undefined;
  
  t.games.push({
    id: crypto.randomUUID(),
    a: t.teams[aIndex],
    b: t.teams[bIndex],
    as,
    bs,
    pool
  });
  
  save();
  renderPoolPlay(t);
}

function saveEditedTournyGame(id, i){
  let t = db.tournaments.find(x=>x.id===id);

  if(!g) return alert('Game not found');

function editTournyGameById(tournyId, gameId){

  let t = db.tournaments.find(x=>x.id===tournyId);

  if(idx===-1) return alert('Game not found');

function deleteTournyGame(id, i){

function renderBracket(t){

  app(`

  <div class="row">

    <button class="secondary"
      onclick="showTournaments()">

      onclick="deleteTournament('${t.id}')">

  </div>

  <div class="card">

    <h2>${esc(t.name)}</h2>

    <div class="muted">Bracket</div>

    <div class="row">

      <button onclick="addTeamBracket('${t.id}')">
        + Team
      </button>

      ${t.teams.length >= 2 ? `
        <button onclick="generateBracket('${t.id}')">
          Generate Bracket
        </button>
      ` : ""}

    </div>

  </div>

  ${t.rounds.length === 0 ? `

  <div class="card">

    <h3>Teams</h3>

    ${t.teams.length ? `

    <table>
      <tr>
        <th>Team</th>
        <th></th>
      </tr>

      ${t.teams.map(team => `
      <tr>
        <td>${esc(team)}</td>
        <td>
          <button class="danger" onclick="removeTeamBracket('${t.id}', '${encodeURIComponent(team)}')">Remove</button>
        </td>
      </tr>
      `).join("")}

    </table>

    ` : `
    <div class="empty">
      No teams yet. Add teams to start.
    </div>
    `}

  </div>

  ` : `

  <div class="bracket">

    ${t.rounds.map((round, roundIdx) => `

    <div class="round">

      <div style="font-size: 12px; font-weight: 700; margin-bottom: 8px; color: #6b7280;">
        ${roundIdx === 0 ? 'Round 1' : roundIdx === t.rounds.length - 1 ? 'Finals' : `Round ${roundIdx + 1}`}
      </div>

      ${round.matches.map((match, matchIdx) => `

      <div class="match">

        ${match.teams.map((team, teamIdx) => `

        <div class="match slot ${match.winner === teamIdx ? 'winner' : ''}">

          <span>
            ${team.name ? esc(team.name) : '—'}
          </span>

          <span>
            ${team.score ?? '—'}
          </span>

        </div>

        `).join("")}

        <div style="margin-top: 8px;">

          <button class="secondary" style="width: 100%;"
            onclick="editMatch('${t.id}', ${roundIdx}, ${matchIdx})">
            Edit Match
          </button>

        </div>

      </div>

      `).join("")}

    </div>

    `).join("")}

  </div>

  `}

  `);
}

function generateBracket(id){
  let t = db.tournaments.find(x=>x.id===id);
  
  if(t.rounds.length === 0){
    let teams = [...t.teams].sort(() => Math.random() - 0.5);
    
    let rounds = [];
    let currentRound = {matches: []};
    
    for(let i = 0; i < teams.length; i += 2){
      currentRound.matches.push({
        teams: [
          {name: teams[i], score: null},
          {name: teams[i+1] || null, score: null}
        ],
        winner: null
      });
    }
    
    rounds.push(currentRound);
    
    while(rounds[rounds.length-1].matches.length > 1){
      let nextRound = {matches: []};
      for(let i = 0; i < rounds[rounds.length-1].matches.length; i += 2){
        nextRound.matches.push({
          teams: [
            {name: null, score: null},
            {name: null, score: null}
          ],
          winner: null
        });
      }
      rounds.push(nextRound);
    }
    
    t.rounds = rounds;
    save();
  }
  
  renderBracket(t);
}

function editMatch(id, roundIdx, matchIdx){
  let t = db.tournaments.find(x=>x.id===id);
  let match = t.rounds[roundIdx].matches[matchIdx];
  
  app(`
  
  <div class="card">
  
    <h2>Edit Match</h2>
    
    <div class="field">
    
      <label>Team 1</label>
      
      <input
        id="match1"
        type="text"
        placeholder="Team 1"
        value="${match.teams[0].name || ''}"
      >
    
    </div>
    
    <div class="field">
    
      <label>Team 1 Score</label>
      
      <input
        id="score1"
        type="number"
        min="0"
        value="${match.teams[0].score ?? ''}"
      >
    
    </div>
    
    <div class="field">
    
      <label>Team 2</label>
      
      <input
        id="match2"
        type="text"
        placeholder="Team 2"
        value="${match.teams[1].name || ''}"
      >
    
    </div>
    
    <div class="field">
    
      <label>Team 2 Score</label>
      
      <input
        id="score2"
        type="number"
        min="0"
        value="${match.teams[1].score ?? ''}"
      >
    
    </div>
    
    <div class="row">
    
      <button onclick="saveMatch('${id}', ${roundIdx}, ${matchIdx})">
        Save Match
      </button>
      
      <button class="secondary"
        onclick="renderBracket(
          db.tournaments.find(x=>x.id==='${id}')
        )">
        Cancel
      </button>
    
    </div>
  
  </div>
  `);
}

function saveMatch(id, roundIdx, matchIdx){
  let t = db.tournaments.find(x=>x.id===id);
  let match = t.rounds[roundIdx].matches[matchIdx];
  
  let team1 = document.getElementById("match1").value;
  let team2 = document.getElementById("match2").value;
  let score1 = document.getElementById("score1").value;
  let score2 = document.getElementById("score2").value;
  
  if(!team1 || !team2) return alert("Enter both team names.");
  
  match.teams[0].name = team1;
  match.teams[1].name = team2;
  
  if(score1 !== "") match.teams[0].score = Number(score1);
  if(score2 !== "") match.teams[1].score = Number(score2);
  
  if(match.teams[0].score !== null && match.teams[1].score !== null){
    if(match.teams[0].score > match.teams[1].score){
      match.winner = 0;
      
      if(roundIdx < t.rounds.length - 1){
        let nextMatch = t.rounds[roundIdx+1].matches[Math.floor(matchIdx/2)];
        if(matchIdx % 2 === 0){
          nextMatch.teams[0].name = team1;
        }else{
          nextMatch.teams[1].name = team1;
        }
      }
    }else if(match.teams[1].score > match.teams[0].score){
      match.winner = 1;
      
      if(roundIdx < t.rounds.length - 1){
        let nextMatch = t.rounds[roundIdx+1].matches[Math.floor(matchIdx/2)];
        if(matchIdx % 2 === 0){
          nextMatch.teams[0].name = team2;
        }else{
          nextMatch.teams[1].name = team2;
        }
      }
    }
  }
  
  save();
  renderBracket(t);
}

function addTeamBracket(id){
  let t = db.tournaments.find(x=>x.id===id);
  
  let n = prompt("Team name?");
  if(!n) return;
  
  if(!t.teams.includes(n)) t.teams.push(n);
  
  save();
  renderBracket(t);
}

function removeTeamBracket(id, en){
  let t = db.tournaments.find(x=>x.id===id);
  let n = decodeURIComponent(en);
  
  if(confirm("Remove " + n + "?")){
    t.teams = t.teams.filter(x => x !== n);
    t.rounds = [];
    save();
    renderBracket(t);
  }
}

function deleteTournament(id){
  if(confirm("Delete this tournament?")){
    db.tournaments = db.tournaments.filter(x=>x.id!==id);
    save();
    showTournaments();
  }
}
